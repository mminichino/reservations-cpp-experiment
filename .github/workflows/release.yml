name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux zip
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libcurl4-openssl-dev libfmt-dev \
            gpg curl

      - name: Install Couchbase C++ SDK (noble)
        run: |
          set -euo pipefail
          DIST_ARCH="$(. /etc/os-release; echo ${VERSION_CODENAME}/$(uname -m))"
          curl -fsSL "https://packages.couchbase.com/clients/cxx/repos/deb/${DIST_ARCH}/DEB-GPG-KEY.txt" \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/couchbase-archive-keyring.gpg
          sudo curl -fsSL -o /etc/apt/sources.list.d/couchbase-cxx-client.sources \
            "https://packages.couchbase.com/clients/cxx/repos/deb/${DIST_ARCH}/couchbase-cxx-client.sources"
          sudo apt-get update
          sudo apt-get install -y couchbase-cxx-client couchbase-cxx-client-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Stage distribution zip
        id: stage
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE_NAME="reservations-cpp-experiment-${VERSION}-linux-x86_64"
          STAGE_DIR="${RUNNER_TEMP}/${STAGE_NAME}"
          mkdir -p "${STAGE_DIR}/bin"

          rsync -a \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude 'cmake-build-*/' \
            --exclude '.idea/' \
            --exclude '.env' \
            --exclude '.cursor/' \
            --exclude 'dist/' \
            --exclude '.github/' \
            ./ "${STAGE_DIR}/"

          install -m 0755 build/load build/exercise "${STAGE_DIR}/bin/"

          cat > "${STAGE_DIR}/RUN.txt" <<EOF
          reservations-cpp-experiment ${VERSION} (Linux x86_64)

          Pre-built binaries: ./bin/load  ./bin/exercise
          Runtime deps: couchbase-cxx-client, libcurl, libfmt (see README.md Ubuntu section).

          Quick start:
            cp .env.example .env   # edit credentials
            ./bin/load .env
            ./bin/exercise .env 4

          To rebuild from the bundled sources:
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"\$(nproc)"
          EOF

          mkdir -p dist
          (
            cd "${RUNNER_TEMP}"
            zip -r "${GITHUB_WORKSPACE}/dist/${STAGE_NAME}.zip" "${STAGE_NAME}"
          )
          cp "dist/${STAGE_NAME}.zip" "dist/reservations-cpp-experiment-latest-linux-x86_64.zip"

          echo "version_zip=dist/${STAGE_NAME}.zip" >> "${GITHUB_OUTPUT}"
          echo "latest_zip=dist/reservations-cpp-experiment-latest-linux-x86_64.zip" >> "${GITHUB_OUTPUT}"
          ls -lh dist/

      - name: Create GitHub Release for tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.stage.outputs.version_zip }}
            ${{ steps.stage.outputs.latest_zip }}

      - name: Point latest tag at this release and refresh latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag=false || true
          fi
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force

          gh release create latest \
            "${{ steps.stage.outputs.latest_zip }}" \
            --title "Latest (${GITHUB_REF_NAME})" \
            --notes "Tracks the newest versioned release **${GITHUB_REF_NAME}**. Prefer version tags (e.g. \`${GITHUB_REF_NAME}\`) for reproducible downloads; use this release for a stable asset URL." \
            --latest=false
